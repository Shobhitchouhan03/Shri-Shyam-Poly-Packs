<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <g filter="url(#sh)" transform="translate(230, 75)">
    <!-- Main Food Grain Bag Body -->
    <path d="M 35 30 Q 170 10 305 30 L 320 430 Q 170 450 20 430 Z" fill="#F6F4EE"/>

    <!-- Food Grade Stamp Badge -->
    <circle cx="270" cy="90" r="30" fill="#1D6448" stroke="#C59A4A" stroke-width="2"/>
    <text x="270" y="90" font-family="sans-serif" font-weight="bold" font-size="8" fill="#FFFFFF" text-anchor="middle">FOOD GRADE</text>
    <text x="270" y="100" font-family="sans-serif" font-weight="extrabold" font-size="10" fill="#C59A4A" text-anchor="middle">100% VIRGIN</text>

    <!-- Top Hem -->
    <path d="M 35 30 Q 170 10 305 30 L 308 55 Q 170 35 32 55 Z" fill="#103D2D"/>
    <path d="M 40 42 L 300 42" stroke="#C59A4A" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Grain Print Layout -->
    <rect x="55" y="140" width="215" height="220" rx="6" fill="#103D2D"/>
    <text x="162" y="175" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle" letter-spacing="2">RICE & WHEAT MILLS</text>
    <text x="162" y="200" font-family="sans-serif" font-weight="extrabold" font-size="18" fill="#FFFFFF" text-anchor="middle">FOOD GRAIN SACK</text>
    <text x="162" y="220" font-family="sans-serif" font-weight="bold" font-size="12" fill="#E8E0D1" text-anchor="middle">HYGIENIC VIRGIN POLYMER</text>
    <line x1="75" y1="235" x2="250" y2="235" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
    <text x="162" y="260" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">ODORLESS • NON-TOXIC</text>
    <text x="162" y="280" font-family="sans-serif" font-weight="bold" font-size="11" fill="#C59A4A" text-anchor="middle">25 KG / 50 KG CAPACITY</text>

    <!-- Bottom Stitch -->
    <path d="M 22 430 L 318 430" stroke="#103D2D" stroke-width="6"/>
    <path d="M 22 430 L 318 430" stroke="#C59A4A" stroke-width="2" stroke-dasharray="6,3"/>
  </g>
</svg>
