<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A18"/>
      <stop offset="100%" stop-color="#103D2D"/>
    </linearGradient>
    <pattern id="open_mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#F6F4EE"/>
      <path d="M0 7H14M7 0V14" stroke="#BDB2A0" stroke-width="2.5"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <g filter="url(#sh)" transform="translate(230, 75)">
    <!-- Breathable Mesh Unlaminated Sack -->
    <path d="M 35 30 Q 170 10 305 30 L 320 430 Q 170 450 20 430 Z" fill="url(#open_mesh)"/>

    <!-- Tie String Top Drawstring -->
    <path d="M 40 30 Q 170 15 300 30" stroke="#C59A4A" stroke-width="5" fill="none"/>
    <path d="M 280 30 L 320 60 M 290 32 L 325 50" stroke="#C59A4A" stroke-width="4"/>

    <!-- Spec Label -->
    <rect x="65" y="140" width="195" height="180" rx="6" fill="#103D2D" opacity="0.95" stroke="#C59A4A" stroke-width="1.5"/>
    <text x="162" y="170" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle" letter-spacing="2">AIR PERMEABLE</text>
    <text x="162" y="195" font-family="sans-serif" font-weight="extrabold" font-size="16" fill="#FFFFFF" text-anchor="middle">UNLAMINATED BAG</text>
    <text x="162" y="215" font-family="sans-serif" font-weight="bold" font-size="12" fill="#E8E0D1" text-anchor="middle">POTATO & ONION MESH</text>
    <line x1="85" y1="230" x2="240" y2="230" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
    <text x="162" y="255" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">PREVENTS CROP SPOILAGE</text>
    <text x="162" y="275" font-family="sans-serif" font-weight="bold" font-size="11" fill="#C59A4A" text-anchor="middle">OPEN WEAVE VENTILATION</text>
  </g>
</svg>
