<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A18"/>
      <stop offset="100%" stop-color="#103D2D"/>
    </linearGradient>
    <pattern id="hdpe_weave" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E8E0D1"/>
      <path d="M0 5H10M5 0V10" stroke="#B8AD98" stroke-width="1.8"/>
      <rect x="0" y="0" width="5" height="5" fill="#DCD3C1"/>
      <rect x="5" y="5" width="5" height="5" fill="#DCD3C1"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  
  <g filter="url(#sh)" transform="translate(230, 80)">
    <!-- Main Heavy-Duty HDPE Sack Body -->
    <path d="M 35 30 Q 170 10 305 30 L 320 430 Q 170 450 20 430 Z" fill="url(#hdpe_weave)"/>

    <!-- Reinforced Top Hem -->
    <path d="M 35 30 Q 170 10 305 30 L 308 55 Q 170 35 32 55 Z" fill="#103D2D"/>
    <path d="M 40 42 L 300 42" stroke="#C59A4A" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Heavy Double Bottom Stitching -->
    <path d="M 22 422 L 318 422" stroke="#171A18" stroke-width="8"/>
    <path d="M 22 422 L 318 422" stroke="#C59A4A" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Spec Label -->
    <rect x="65" y="130" width="195" height="170" rx="6" fill="#171A18" opacity="0.95" stroke="#1D6448" stroke-width="2"/>
    <text x="162" y="165" font-family="sans-serif" font-weight="bold" font-size="13" fill="#C59A4A" text-anchor="middle" letter-spacing="2">HEAVY DUTY</text>
    <text x="162" y="188" font-family="sans-serif" font-weight="extrabold" font-size="16" fill="#FFFFFF" text-anchor="middle">HDPE WOVEN SACK</text>
    <line x1="85" y1="202" x2="240" y2="202" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
    <text x="162" y="225" font-family="sans-serif" font-size="11" fill="#E8E0D1" text-anchor="middle">HIGH DENSITY POLYETHYLENE</text>
    <text x="162" y="245" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">FERTILIZER & CHEMICAL GRADE</text>
    <text x="162" y="268" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1D6448" text-anchor="middle">TEAR & DROP RESISTANT</text>
  </g>
</svg>
