<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <pattern id="roll_mesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F6F4EE"/>
      <path d="M0 4H8M4 0V8" stroke="#D0C5B2" stroke-width="1.2"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Industrial Polypropylene Fabric Roll Render -->
  <g filter="url(#sh)" transform="translate(180, 140)">
    <!-- Main Cylinder Roll Body -->
    <rect x="80" y="80" width="380" height="180" rx="4" fill="url(#roll_mesh)"/>

    <!-- Concentric Roll Edges (Left Face) -->
    <ellipse cx="80" cy="170" rx="35" ry="90" fill="#E8E0D1" stroke="#103D2D" stroke-width="3"/>
    <ellipse cx="80" cy="170" rx="26" ry="65" fill="#DCD3C1" stroke="#103D2D" stroke-width="2"/>
    <ellipse cx="80" cy="170" rx="16" ry="40" fill="#171A18"/>
    <!-- Paper Core Center -->
    <ellipse cx="80" cy="170" rx="10" ry="25" fill="#C59A4A"/>

    <!-- Concentric Roll Edges (Right End) -->
    <path d="M 460 80 A 35 90 0 0 1 460 260 L 460 80 Z" fill="#D5CCBB"/>

    <!-- Woven Tape Strands Edge -->
    <line x1="80" y1="80" x2="460" y2="80" stroke="#C59A4A" stroke-width="4"/>
    <line x1="80" y1="260" x2="460" y2="260" stroke="#103D2D" stroke-width="4"/>

    <!-- Label Tag -->
    <rect x="180" y="120" width="180" height="100" rx="6" fill="#103D2D" opacity="0.95" stroke="#C59A4A" stroke-width="1.5"/>
    <text x="270" y="148" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle" letter-spacing="2">INDUSTRIAL</text>
    <text x="270" y="168" font-family="sans-serif" font-weight="extrabold" font-size="14" fill="#FFFFFF" text-anchor="middle">PP WOVEN FABRIC ROLL</text>
    <text x="270" y="190" font-family="sans-serif" font-size="10" fill="#E8E0D1" text-anchor="middle">TUBULAR / FLAT • UP TO 2000M</text>
    <text x="270" y="206" font-family="sans-serif" font-weight="bold" font-size="10" fill="#1D6448" text-anchor="middle">AUTOMATED CONVERTING READY</text>
  </g>
</svg>
