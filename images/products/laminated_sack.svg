<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#F6F4EE"/>
      <stop offset="70%" stop-color="#E8E0D1"/>
      <stop offset="100%" stop-color="#DCD3C1"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <g filter="url(#sh)" transform="translate(230, 75)">
    <!-- Glossy Laminated Sack Body -->
    <path d="M 35 30 Q 170 10 305 30 L 320 430 Q 170 450 20 430 Z" fill="url(#gloss)"/>

    <!-- Shiny Lamination Glare Line -->
    <path d="M 60 50 L 100 420" stroke="#FFFFFF" stroke-width="20" opacity="0.3" stroke-linecap="round"/>

    <!-- Moisture Barrier Indicator Ribbon -->
    <rect x="65" y="120" width="195" height="180" rx="8" fill="#103D2D" opacity="0.95" stroke="#C59A4A" stroke-width="2"/>
    <text x="162" y="155" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle" letter-spacing="2">100% MOISTURE PROOF</text>
    <text x="162" y="178" font-family="sans-serif" font-weight="extrabold" font-size="15" fill="#FFFFFF" text-anchor="middle">LAMINATED WOVEN SACK</text>
    <line x1="85" y1="192" x2="240" y2="192" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
    <text x="162" y="215" font-family="sans-serif" font-size="11" fill="#E8E0D1" text-anchor="middle">BOPP / POLY EXTRUSION LAYER</text>
    <text x="162" y="235" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">SUGAR & CEMENT SPECIFICATION</text>
    <text x="162" y="260" font-family="sans-serif" font-weight="bold" font-size="11" fill="#C59A4A" text-anchor="middle">ZERO SEEPAGE GUARANTEE</text>
  </g>
</svg>
