<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A18"/>
      <stop offset="100%" stop-color="#103D2D"/>
    </linearGradient>
    <pattern id="pr_woven" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFFFFF"/>
      <path d="M0 5H10M5 0V10" stroke="#E2DAD0" stroke-width="1.5"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <g filter="url(#sh)" transform="translate(230, 75)">
    <!-- Main Printed Woven Bag -->
    <path d="M 35 30 Q 170 10 305 30 L 320 430 Q 170 450 20 430 Z" fill="url(#pr_woven)"/>

    <!-- High-Impact Flexographic Brand Printing Graphic Layer -->
    <rect x="50" y="90" width="225" height="260" rx="4" fill="#103D2D"/>
    
    <!-- Multi-color Brand Graphic -->
    <circle cx="162" cy="160" r="45" fill="#1D6448" stroke="#C59A4A" stroke-width="3"/>
    <text x="162" y="166" font-family="sans-serif" font-weight="extrabold" font-size="22" fill="#C59A4A" text-anchor="middle">SSPP</text>
    
    <text x="162" y="235" font-family="sans-serif" font-weight="extrabold" font-size="18" fill="#FFFFFF" text-anchor="middle">PREMIUM BRAND</text>
    <text x="162" y="255" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle">6-COLOR FLEXO PRINTING</text>

    <!-- Barcode & Batch Code Graphic -->
    <rect x="75" y="280" width="175" height="40" fill="#FFFFFF"/>
    <path d="M 85 290 V 310 M 90 290 V 310 M 98 290 V 310 M 105 290 V 310 M 115 290 V 310 M 125 290 V 310 M 135 290 V 310 M 145 290 V 310 M 155 290 V 310 M 170 290 V 310 M 180 290 V 310 M 195 290 V 310 M 210 290 V 310 M 230 290 V 310" stroke="#171A18" stroke-width="2"/>
    <text x="162" y="316" font-family="monospace" font-size="8" fill="#171A18" text-anchor="middle">BARCODE / BATCH CONTROL</text>

    <!-- Bottom Hem Stitch -->
    <path d="M 22 430 L 318 430" stroke="#103D2D" stroke-width="6"/>
    <path d="M 22 430 L 318 430" stroke="#C59A4A" stroke-width="2" stroke-dasharray="6,3"/>
  </g>
</svg>
