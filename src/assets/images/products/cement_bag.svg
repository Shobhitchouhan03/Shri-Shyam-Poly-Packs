<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Block-Bottom Valve Cement Sack Render -->
  <g filter="url(#sh)" transform="translate(230, 80)">
    <!-- Main Rectangular Block Bottom Body -->
    <rect x="30" y="40" width="260" height="360" rx="8" fill="#E8E0D1" stroke="#103D2D" stroke-width="3"/>
    
    <!-- Block Top Fold -->
    <polygon points="30,40 290,40 260,10 60,10" fill="#D5CCBB" stroke="#103D2D" stroke-width="2"/>

    <!-- Self-Closing Internal Valve Sleeve -->
    <rect x="180" y="25" width="80" height="30" rx="4" fill="#C59A4A" stroke="#171A18" stroke-width="2"/>
    <text x="220" y="44" font-family="sans-serif" font-weight="bold" font-size="10" fill="#171A18" text-anchor="middle">VALVE SLEEVE</text>

    <!-- Micro-Perforation Vents Pattern Graphic -->
    <g opacity="0.3" fill="#171A18">
      <circle cx="50" cy="100" r="1.5"/><circle cx="70" cy="100" r="1.5"/><circle cx="90" cy="100" r="1.5"/><circle cx="110" cy="100" r="1.5"/>
      <circle cx="50" cy="120" r="1.5"/><circle cx="70" cy="120" r="1.5"/><circle cx="90" cy="120" r="1.5"/><circle cx="110" cy="120" r="1.5"/>
    </g>

    <!-- Cement Packaging Layout Print -->
    <rect x="50" y="140" width="220" height="180" rx="4" fill="#103D2D"/>
    <text x="160" y="175" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle" letter-spacing="2">CONSTRUCTION GRADE</text>
    <text x="160" y="200" font-family="sans-serif" font-weight="extrabold" font-size="18" fill="#FFFFFF" text-anchor="middle">CEMENT SACK</text>
    <text x="160" y="220" font-family="sans-serif" font-weight="bold" font-size="13" fill="#E8E0D1" text-anchor="middle">BLOCK BOTTOM VALVE</text>
    <line x1="70" y1="235" x2="250" y2="235" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
    <text x="160" y="260" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">50 KG CAPACITY • DUSTLESS</text>
    <text x="160" y="280" font-family="sans-serif" font-weight="bold" font-size="11" fill="#C59A4A" text-anchor="middle">MICRO-PERFORATED VENTS</text>

    <!-- Block Bottom Seam Fold -->
    <polygon points="30,400 290,400 260,430 60,430" fill="#103D2D"/>
    <path d="M 60 415 L 260 415" stroke="#C59A4A" stroke-width="2" stroke-dasharray="6,3"/>
  </g>
</svg>
