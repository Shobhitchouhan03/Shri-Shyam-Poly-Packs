<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Construction Cement Sack & Building Render -->
  <g filter="url(#sh)" transform="translate(250, 100)">
    <rect x="30" y="40" width="240" height="340" rx="8" fill="#E8E0D1" stroke="#103D2D" stroke-width="3"/>
    <rect x="50" y="120" width="200" height="180" rx="6" fill="#103D2D"/>
    <text x="150" y="155" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle" letter-spacing="2">CONSTRUCTION SPEC</text>
    <text x="150" y="185" font-family="sans-serif" font-weight="extrabold" font-size="18" fill="#FFFFFF" text-anchor="middle">CEMENT SACK</text>
    <text x="150" y="210" font-family="sans-serif" font-weight="bold" font-size="13" fill="#E8E0D1" text-anchor="middle">BLOCK BOTTOM VALVE</text>
    <line x1="70" y1="225" x2="230" y2="225" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
    <text x="150" y="250" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">50 KG CAPACITY • DUSTPROOF</text>
  </g>
</svg>
