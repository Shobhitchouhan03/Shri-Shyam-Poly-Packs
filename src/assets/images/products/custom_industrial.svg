<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Assorted Custom Bag Sizes, Colors & Loops Render -->
  <g filter="url(#sh)">
    <!-- Small Bag Sample (Beige) -->
    <g transform="translate(140, 180) scale(0.65)">
      <rect x="0" y="0" width="220" height="320" rx="8" fill="#E8E0D1" stroke="#103D2D" stroke-width="3"/>
      <rect x="20" y="60" width="180" height="120" fill="#1D6448"/>
      <text x="110" y="125" font-family="sans-serif" font-weight="bold" font-size="16" fill="#C59A4A" text-anchor="middle">5 KG SMALL</text>
    </g>

    <!-- Medium Bag Sample (White) -->
    <g transform="translate(480, 160) scale(0.75)">
      <rect x="0" y="0" width="250" height="360" rx="8" fill="#FFFFFF" stroke="#103D2D" stroke-width="3"/>
      <rect x="25" y="80" width="200" height="140" fill="#103D2D"/>
      <text x="125" y="150" font-family="sans-serif" font-weight="bold" font-size="16" fill="#C59A4A" text-anchor="middle">25 KG SPEC</text>
    </g>

    <!-- Heavy FIBC / Jumbo Loop Custom Sack Main Center -->
    <g transform="translate(260, 100)">
      <!-- Lifting Loop Left -->
      <path d="M 50 40 C 50 -10 100 -10 100 40" stroke="#C59A4A" stroke-width="12" fill="none"/>
      <!-- Lifting Loop Right -->
      <path d="M 180 40 C 180 -10 230 -10 230 40" stroke="#C59A4A" stroke-width="12" fill="none"/>

      <rect x="30" y="40" width="220" height="340" rx="10" fill="#F6F4EE" stroke="#103D2D" stroke-width="4"/>

      <!-- Spec Badge -->
      <rect x="50" y="110" width="180" height="180" rx="6" fill="#103D2D"/>
      <text x="140" y="145" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle" letter-spacing="2">BESPOKE SOLUTION</text>
      <text x="140" y="170" font-family="sans-serif" font-weight="extrabold" font-size="15" fill="#FFFFFF" text-anchor="middle">CUSTOM PACKAGING</text>
      <line x1="65" y1="185" x2="215" y2="185" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
      <text x="140" y="208" font-family="sans-serif" font-size="11" fill="#E8E0D1" text-anchor="middle">CUSTOM GSM & LINERS</text>
      <text x="140" y="228" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">LIFTING LOOPS & GUSSET</text>
      <text x="140" y="250" font-family="sans-serif" font-weight="bold" font-size="11" fill="#C59A4A" text-anchor="middle">TAILORED DIMENSIONS</text>
    </g>
  </g>
</svg>
