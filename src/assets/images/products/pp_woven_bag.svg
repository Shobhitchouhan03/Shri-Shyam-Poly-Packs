<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <linearGradient id="bag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F4EE"/>
      <stop offset="100%" stop-color="#E8E0D1"/>
    </linearGradient>
    <pattern id="woven" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#F6F4EE"/>
      <path d="M0 6H12M6 0V12" stroke="#D5CCBB" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="6" fill="#EDE5D6" opacity="0.5"/>
      <rect x="6" y="6" width="6" height="6" fill="#EDE5D6" opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Studio Grid -->
  <path d="M0 450 L800 450" stroke="#C59A4A" stroke-width="1" opacity="0.2"/>
  <rect x="0" y="450" width="800" height="150" fill="#103D2D" opacity="0.5"/>

  <!-- Stacked PP Woven Bag Main -->
  <g filter="url(#shadow)" transform="translate(240, 70)">
    <!-- Main Sack Body -->
    <path d="M 40 40 Q 160 20 280 40 L 300 440 Q 160 460 20 440 Z" fill="url(#woven)"/>
    
    <!-- Top Fold & Hem Stitching -->
    <path d="M 40 40 Q 160 20 280 40 L 285 65 Q 160 45 35 65 Z" fill="#1D6448"/>
    <path d="M 45 52 L 275 52" stroke="#C59A4A" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Bottom Double Seam Stitching -->
    <path d="M 22 430 L 298 430" stroke="#103D2D" stroke-width="6"/>
    <path d="M 22 430 L 298 430" stroke="#C59A4A" stroke-width="2" stroke-dasharray="8,4"/>
    <path d="M 24 438 L 296 438" stroke="#1D6448" stroke-width="2" stroke-dasharray="8,4"/>

    <!-- Brand & Spec Badge -->
    <rect x="60" y="140" width="200" height="160" rx="8" fill="#103D2D" opacity="0.95" stroke="#C59A4A" stroke-width="1.5"/>
    <text x="160" y="175" font-family="sans-serif" font-weight="bold" font-size="14" fill="#C59A4A" text-anchor="middle" letter-spacing="2">SHRI SHYAM</text>
    <text x="160" y="195" font-family="sans-serif" font-weight="extrabold" font-size="16" fill="#FFFFFF" text-anchor="middle">PP WOVEN BAG</text>
    <line x1="80" y1="210" x2="240" y2="210" stroke="#C59A4A" stroke-width="1" opacity="0.5"/>
    <text x="160" y="235" font-family="sans-serif" font-size="12" fill="#E8E0D1" text-anchor="middle">100% VIRGIN POLYMER</text>
    <text x="160" y="255" font-family="sans-serif" font-size="11" fill="#66706B" text-anchor="middle">HIGH TENSILE • 50 KG SACK</text>
    <text x="160" y="275" font-family="sans-serif" font-weight="bold" font-size="11" fill="#C59A4A" text-anchor="middle">ISO CERTIFIED SPEC</text>
  </g>

  <!-- Side Shadow Accent Sacks -->
  <g opacity="0.3" transform="translate(100, 120) scale(0.8)">
    <path d="M 40 40 Q 160 20 280 40 L 300 440 Q 160 460 20 440 Z" fill="url(#woven)"/>
  </g>
</svg>
