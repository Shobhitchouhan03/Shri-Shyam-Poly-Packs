<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103D2D"/>
      <stop offset="100%" stop-color="#171A18"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Circular Loom Machine Vector Diagram -->
  <g filter="url(#sh)" transform="translate(400, 300)">
    <!-- Outer Loom Ring -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#C59A4A" stroke-width="8" stroke-dasharray="16,8"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#1D6448" stroke-width="12"/>

    <!-- Warp Threads Rays -->
    <g stroke="#E8E0D1" stroke-width="2" opacity="0.6">
      <line x1="0" y1="-180" x2="0" y2="180"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="-127" y1="-127" x2="127" y2="127"/>
      <line x1="-127" y1="127" x2="127" y2="-127"/>
      <line x1="-166" y1="-68" x2="166" y2="68"/>
      <line x1="-166" y1="68" x2="166" y2="-68"/>
      <line x1="-68" y1="-166" x2="68" y2="166"/>
      <line x1="-68" y1="166" x2="68" y2="-166"/>
    </g>

    <!-- Circular Shuttle Wheels -->
    <circle cx="-130" cy="0" r="24" fill="#C59A4A" stroke="#171A18" stroke-width="3"/>
    <circle cx="130" cy="0" r="24" fill="#C59A4A" stroke="#171A18" stroke-width="3"/>
    <circle cx="0" cy="-130" r="24" fill="#C59A4A" stroke="#171A18" stroke-width="3"/>
    <circle cx="0" cy="130" r="24" fill="#C59A4A" stroke="#171A18" stroke-width="3"/>

    <!-- Center Tubular Woven Fabric Tube -->
    <circle cx="0" cy="0" r="90" fill="#F6F4EE" stroke="#103D2D" stroke-width="6"/>
    <text x="0" y="-10" font-family="sans-serif" font-weight="extrabold" font-size="16" fill="#103D2D" text-anchor="middle">CIRCULAR LOOM</text>
    <text x="0" y="15" font-family="sans-serif" font-weight="bold" font-size="12" fill="#C59A4A" text-anchor="middle">HIGH-SPEED WEAVING</text>
    <text x="0" y="32" font-family="sans-serif" font-size="10" fill="#66706B" text-anchor="middle">PP WOVEN TUBULAR FABRIC</text>
  </g>
</svg>
